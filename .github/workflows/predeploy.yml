name: Predeploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Environment to predeploy
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  predeploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || inputs.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run predeploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: pnpm run predeploy
