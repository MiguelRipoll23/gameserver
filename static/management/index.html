<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server management</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Light theme (default) */
  :root {
    color-scheme: light dark;
    --hood-bg: 248 250 252;
    --hood-card: 255 255 255;
    --hood-border: 226 232 240;
    --hood-accent: 99 102 241;
    --hood-accent-hover: 79 70 229;
    --hood-danger: 239 68 68;
    --hood-danger-hover: 220 38 38;
    --hood-success: 22 163 74;
    --hood-warn: 245 158 11;
    --hood-text: 30 41 59;
    --hood-heading: 15 23 42;
    --hood-muted: 100 116 139;
    --hood-accent-text: 67 56 202;
    --hood-overlay: 15 23 42;
  }

  /* Dark theme (system preference) */
  @media (prefers-color-scheme: dark) {
    :root {
      --hood-bg: 15 17 23;
      --hood-card: 26 29 39;
      --hood-border: 42 45 58;
      --hood-accent: 99 102 241;
      --hood-accent-hover: 129 140 248;
      --hood-danger: 239 68 68;
      --hood-danger-hover: 220 38 38;
      --hood-success: 34 197 94;
      --hood-warn: 245 158 11;
      --hood-text: 229 231 235;
      --hood-heading: 255 255 255;
      --hood-muted: 156 163 175;
      --hood-accent-text: 165 180 252;
      --hood-overlay: 255 255 255;
    }
  }
</style>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          hood: {
            bg: 'rgb(var(--hood-bg) / <alpha-value>)',
            card: 'rgb(var(--hood-card) / <alpha-value>)',
            border: 'rgb(var(--hood-border) / <alpha-value>)',
            accent: 'rgb(var(--hood-accent) / <alpha-value>)',
            'accent-hover': 'rgb(var(--hood-accent-hover) / <alpha-value>)',
            danger: 'rgb(var(--hood-danger) / <alpha-value>)',
            'danger-hover': 'rgb(var(--hood-danger-hover) / <alpha-value>)',
            success: 'rgb(var(--hood-success) / <alpha-value>)',
            warn: 'rgb(var(--hood-warn) / <alpha-value>)',
            text: 'rgb(var(--hood-text) / <alpha-value>)',
            heading: 'rgb(var(--hood-heading) / <alpha-value>)',
            muted: 'rgb(var(--hood-muted) / <alpha-value>)',
            'accent-text': 'rgb(var(--hood-accent-text) / <alpha-value>)',
            overlay: 'rgb(var(--hood-overlay) / <alpha-value>)'
          }
        }
      }
    }
  }
</script>
</head>
<body class="bg-hood-bg text-hood-text min-h-screen font-sans">
<div class="max-w-5xl mx-auto p-6">

  <!-- Header -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-hood-heading">Server management</h1>
  </div>

  <!-- Search -->
  <div class="mb-6">
    <input id="menu-search" type="search" placeholder="Search tools..." autocomplete="off"
      class="w-full max-w-md bg-hood-bg border border-hood-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-hood-accent transition-colors">
  </div>

  <!-- Menu -->
  <div id="menu-grid" class="grid gap-4 sm:grid-cols-2">
    <a href="game-configuration.html" class="menu-item block bg-hood-card border border-hood-border rounded-xl p-5 hover:border-hood-accent transition-colors group"
       data-title="Game configuration" data-description="Cloud configuration keys and anti-cheat rules">
      <h2 class="text-base font-semibold text-hood-heading group-hover:text-hood-accent transition-colors">Game configuration</h2>
      <p class="text-sm text-hood-muted mt-1">Cloud configuration keys and anti-cheat rules</p>
    </a>
  </div>

  <!-- No results -->
  <div id="menu-empty" class="hidden bg-hood-card border border-hood-border rounded-xl p-8 text-center text-hood-muted text-sm">
    No tools match your search.
  </div>

</div>

<script>
// ── Search filter ──
const searchInput = document.getElementById('menu-search');
const emptyMessage = document.getElementById('menu-empty');

function filterMenu() {
  const query = searchInput.value.trim().toLowerCase();
  let visibleCount = 0;

  document.querySelectorAll('.menu-item').forEach((item) => {
    const title = (item.dataset.title || '').toLowerCase();
    const description = (item.dataset.description || '').toLowerCase();
    const matches = query.length === 0 || title.includes(query) || description.includes(query);
    item.style.display = matches ? '' : 'none';
    if (matches) visibleCount++;
  });

  emptyMessage.classList.toggle('hidden', visibleCount !== 0);
}

searchInput.addEventListener('input', filterMenu);
</script>
</body>
</html>
